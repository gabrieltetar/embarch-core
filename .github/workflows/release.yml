# Release CI for embarch-core (embarch-umbrella/milestone-6.md §3.7).
#
# Builds the four targets embarch-umbrella/design.md §3 decision 14 names —
# native on their own runner where GitHub provides one, `cross` only for
# aarch64-unknown-linux-gnu, where none does — and attaches each as a release
# asset. This is embarch-core's *own* release, one component's binary; the
# combined suite archive all three components go into is assembled
# separately, in embarch-umbrella's assemble-suite.yml, from tagged releases
# like this one.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  BIN: embarch-core

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # No free aarch64-linux GitHub-hosted runner exists, and this is
          # the one target where cross-compiling also means linking a C
          # library (libudev, via probe-rs/serialport) — see Cross.toml.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # GitHub's macos-14 runner is natively Apple Silicon, so this is a
          # native build, not a cross-compile — and unsigned, which the user
          # guide has to mention (milestone-6.md §3.7, §5 open questions).
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    # Cargo.toml depends on both embarch-study-designer and embarch-topology
    # as sibling path dependencies (embarch-doc/DOC-PROTOCOL.md §2's layout:
    # every sub-project sits as a sibling of embarch-doc, not a Cargo
    # workspace — embarch-topology/design.md §5's cross-repo-dependency
    # question, resolved this way rather than inventing a registry/vendoring
    # step). `../embarch-study-designer`/`../embarch-topology` only resolve
    # if this repo's own checkout *also* sits in a same-named sibling
    # directory, not at the workspace root — hence every checkout below
    # gets an explicit `path:`, and every later step runs with
    # `working-directory: embarch-core`. Before this pass, only this repo
    # itself was checked out (at the workspace root, where a relative
    # `../embarch-study-designer` can't resolve at all) — a real, latent gap
    # this pass found and fixed: it predates embarch-topology, since the
    # embarch-study-designer path dependency was added after this
    # workflow's last actually-green run (2026-08-12, before the
    # 2026-08-19 commit that added it).
    defaults:
      run:
        working-directory: embarch-core
    steps:
      - uses: actions/checkout@v4
        with:
          path: embarch-core
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-study-designer
          path: embarch-study-designer
      - uses: actions/checkout@v4
        with:
          repository: gabrieltetar/embarch-topology
          path: embarch-topology

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # The native x86_64-unknown-linux-gnu leg is the *other* place this
      # crate's libudev dependency (probe-rs/serialport, via libudev-sys)
      # bites: ubuntu-latest doesn't ship libudev-dev by default, unlike a
      # real Linux dev machine (found the hard way — v0.1.0's first release
      # run failed here while the cross-compiled aarch64 leg, which installs
      # it explicitly via Cross.toml, succeeded).
      - name: Install libudev (native Linux build only)
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      # `cross` builds inside a Docker container and needs to see the
      # sibling `../embarch-study-designer`/`../embarch-topology` checkouts,
      # not just this crate's own directory. Confirmed via cross-rs's own
      # docs/history (2026-08-24, no Docker available in this dev sandbox to
      # run it for real): cross-rs/cross#684 (merged, shipped v0.2.2+, this
      # workflow's `taiki-e/install-action@v2` installs a current release)
      # auto-mounts any path dependency `cargo metadata` can see — no formal
      # `[workspace]` required, just a plain `path = "../..."` dependency,
      # exactly this repo's `Cargo.toml`. **Still not confirmed by an actual
      # tagged-release CI run on this real layout** — that's the only way to
      # be fully certain (`embarch-dev-workflow.md`-style "don't claim
      # verified without a real run" posture) — but the theoretical doubt
      # this comment used to flag is resolved; a real release run is the
      # remaining, much cheaper-to-clear step, not an open question about
      # whether the mechanism exists at all.
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      # windows-latest already ships the VS Build Tools "Desktop development
      # with C++" workload this crate's MSVC link needs
      # (embarch-core/design.md §7) — nothing extra to install there.

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="${BIN}-${{ matrix.target }}"
          bin="${BIN}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="${BIN}.exe"; fi
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${name}.zip" "${name}" >/dev/null
            # `working-directory: embarch-core` (this job's default) only
            # applies to `run:` steps, not the `uses:` step below — its
            # `files:` glob resolves from $GITHUB_WORKSPACE, so this output
            # needs the `embarch-core/` prefix even though this step itself
            # ran from inside that directory.
            echo "asset=embarch-core/dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "${name}.tar.gz" "${name}"
            echo "asset=embarch-core/dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
