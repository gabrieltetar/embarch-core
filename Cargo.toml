[package]
name = "embarch-core"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.2", features = ["derive"] }
# `core-validation` is the feature this crate's own Cargo.toml comments name
# as the one component meant to enable it (SignalCheck evaluation, that
# crate's design.md §4.6/decision 19) — study.rs doesn't call that evaluation
# code yet (the self-test study it validates against has no `validations`),
# but the feature costs nothing to turn on now and this is the intended place.
embarch-study-designer = { path = "../embarch-study-designer", features = ["core-validation"] }
# study.rs constructs embarch-study-designer types' heapless::Vec fields
# (e.g. StudyResult.steps) directly — same heapless version, so Cargo unifies
# features with embarch-study-designer's own "serde"-enabled dependency.
heapless = "0.8"
# embarch-topology/design.md decisions 2, 4, 8: dev-bench port detection,
# hardware-ID readback, enrollment storage, and live board-identity
# validate() all moved out of this crate's own board_gate.rs/
# known_boards.rs/hardware_id.rs/dev_bench.rs into this shared crate.
# `hardware` is the feature that pulls in probe-rs/serialport — the one
# consumer that needs it; embarch-api/embarch-umbrella depend on the same
# crate without it. `default-features = false` opts out of that crate's own
# `software` feature (Core never calls `embarch_topology::software`,
# confirmed via grep) — its default-on `reqwest` dependency transitively
# pulls in `aws-lc-sys`, a real C-toolchain-needing build dependency this
# crate's own Windows/cross-compilation story has no reason to pay for
# (found via `cargo tree` while wiring this in; `embarch-dev-workflow.md`
# §4 already flags this exact class of risk for a different crate).
embarch-topology = { path = "../embarch-topology", default-features = false, features = ["hardware"] }
# `use-std` is what actually gets `to_stdvec_cobs`/`from_bytes_cobs` — the
# `Vec<u8>`-returning COBS helpers `dev_bench_link.rs` uses, rather than the
# `no_std` slice-only API. postcard depends on `cobs` internally and exposes
# these directly, so no separate `cobs` dependency is needed here.
postcard = { version = "1.1", features = ["use-std"] }
probe-rs = "0.31"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# `usbportinfo-interface` surfaces UsbPortInfo::interface, which dev_bench.rs
# needs to tell two VCOM interfaces of one on-board J-Link apart
# (embarch-dev-bench/design.md §3 decision 12, §4).
serialport = { version = "4.9.0", features = ["usbportinfo-interface"] }
service-manager = "0.11.0"
tempfile = "3.24"
tokio = { version = "1.53.0", features = ["full"] }
# known_boards.toml (design.md §3 decision 22) — same version embarch-api
# already pins, no reason for the two to drift.
toml = "1.1"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = "0.3.23"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
winreg = "0.56.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(unix)".dependencies]
libc = "0.2"
