[package]
name = "embarch-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
clap = { version = "4.6.2", features = ["derive"] }
probe-rs = "0.31"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# `usbportinfo-interface` surfaces UsbPortInfo::interface, which dev_bench.rs
# needs to tell two VCOM interfaces of one on-board J-Link apart
# (embarch-dev-bench/design.md §3 decision 12, §4).
serialport = { version = "4.9.0", features = ["usbportinfo-interface"] }
service-manager = "0.11.0"
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
